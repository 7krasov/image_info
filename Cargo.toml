[package]
name = "image_info"
version = "0.2.1"
edition = "2021"
description = "A library to get base image information from a file"
license = "MIT"
repository = "https://github.com/7krasov/image_info"
keywords = ["image", "metadata", "info", "json", "cli"]

[dependencies]
imagesize = "0.14.0"
serde_json = "1.0.133"
serde = { version = "1.0.215", features = ["derive"] }
infer = "0.19.0"
tree_magic_mini = "3.1.6"

[features]
default = ["render"]
render = []
