[package]
name = "image_info"
version = "0.3.4"
edition = "2021"
description = "A library to get base image information from a file"
license = "MIT"
repository = "https://github.com/7krasov/image_info"
keywords = ["image", "metadata", "info", "cli", "phash"]

[dependencies]
imagesize = "0.14.0"
serde_json = "1.0.133"
serde = { version = "1.0.215", features = ["derive"] }
infer = "0.19.0"
tree_magic_mini = "3.1.6"
image = {version = "0.25.10", optional = true}
image_hasher = {version = "3.1.1", optional = true}
libvips = { version = "1.7.0", optional = true }

[features]
default = ["render"]
render = []
phash = ["dep:image", "dep:image_hasher"]
# HEIF and AVIF are both decoded through libvips. Enable this feature to compute
# pHash for either format.
phash-vips = ["phash", "dep:libvips"]
